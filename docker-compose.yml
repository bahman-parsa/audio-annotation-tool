services:
  postgres:
    image: postgres:16-alpine
    container_name: ikim_postgres
    env_file: .env.dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    container_name: ikim_postgres_test
    env_file: .env.dev
    environment:
      POSTGRES_DB: ikim_annotation_db_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ikim_backend
    ports:
      - "3000:3000"
    env_file: .env.dev
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "yarn prisma migrate deploy && yarn dev"

  frontend:
    build: ./frontend
    container_name: ikim_frontend
    ports:
      - "5173:5173"
    environment:
      API_URL: http://backend:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  postgres_test_data:
  uploads_data:
